[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers

# Classificação exigida pelo Ajuste A da sessão: toda asserção portada dos
# scripts originais é uma coisa ou a outra, e a diferença muda o que fazer
# quando ela falha.
markers =
    invariante: não depende de qual arquivo entrou. Se falhar, é achado — parar e reportar, nunca ajustar o número.
    amarrado_a_arquivo: número que só faz sentido para um recorte de extrato. Recalibrar deliberadamente, registrando valor velho e novo.
    referencia: usa o conjunto de junho/2026 em extratos-referencia/ da raiz do dado (ou EXTRATOS_REF). Sinal de regressão de ambiente.
    atual: usa o conjunto corrente em extratos/ da raiz do dado (ou EXTRATOS_DIR).
